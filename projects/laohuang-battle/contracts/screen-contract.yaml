schema_version: 1
project_id: "laohuang-battle"
screens:
  - id: home
    name: 客栈首页
    category: core
    priority: must-have
    status: approved
    purpose: "让玩家 3 秒内确认「我在第几场、还剩多少酒、下一步点哪」，并从存档直接续战。"
    entry_points:
      - "冷启动"
      - "战斗结算后返回"
      - "settings 页返回"
      - "底部导航「客栈」"
    primary_actions:
      - "接着打（有存档）/ 入江湖（无存档）"
      - "开新局（需确认覆盖）"
      - "打开设置"
    dependencies:
      - "run-progress 存档"
      - "wallet（银两 / 酒 / 声望）"
    layout:
      top:
        - "顶部安全区 56px 后为资源条：银两 · 酒 · 声望，右端设置齿轮（56×56）"
        - "资源条下方左侧为存档时间小字「上次 昨晚 亥时」"
      center:
        - "上段：竖排 LOGO「老黄的战斗」+ 朱砂方印「黄」"
        - "中段：老黄半身立绘（肩扛缺口雁翎刀，旧斗篷落雪），占画面 32%–62% 高度"
        - "立绘下沿：进度木牌「第三场 · 雪夜破庙」+ 流派标签印章（回锋 / 借力 / 残血）"
      bottom:
        - "主按钮「接着打」朱砂实底印章，84px 高，距底 210px"
        - "次按钮横排「开新局」「江湖名录」，56px 高"
        - "底部导航 132px：客栈 / 名录 / 酒壶 / 设置"
      floating:
        - "断网窄条（顶部 6px 墨条 + 文案），3 秒收起"
        - "每日签到小印（右下，可关闭）"
    components:
      - "btn-primary"
      - "btn-secondary"
      - "panel-card"
      - "icon-settings"
      - "top-resource-bar"
      - "nav-bar"
      - "hero-portrait"
      - "logo-seal"
    states:
      - default
      - new-run
      - confirm-overwrite
      - loading
      - error
    edge_cases:
      - "无存档：进度木牌整块隐藏，主按钮切「入江湖」"
      - "存档损坏：窄条提示 + 主按钮降级为「开新局」"
      - "断网：顶部细条提示，不阻塞"
      - "极窄屏 360dp：立绘等比缩放，资源条允许省掉「声望」"
    data_needs:
      - "wallet.silver"
      - "wallet.wine"
      - "wallet.fame"
      - "run.progressStage"
      - "run.stageName"
      - "run.buildTags"
      - "run.lastSavedAt"
    output:
      brief: "prompts/pages/home.md"
      prompt: "prompts/pages/home.md"
      image: "assets/pages/home-v2.png"

  - id: battle
    name: 断桥雪渡 · 常规战
    category: core
    priority: must-have
    status: approved
    purpose: "一屏读懂敌我状态并做出一次出招决策：谁要打我、我还有几点气、这张牌值不值。"
    entry_points:
      - "home 主按钮"
      - "战斗内「下一场」"
    primary_actions:
      - "点手牌出招（消耗气）"
      - "结束回合"
      - "暂停 / 撤退"
    dependencies:
      - "run.progressStage"
      - "battle.enemies"
      - "battle.hand"
    layout:
      top:
        - "顶部 56px 安全区后：左上暂停（56×56）、右上设置齿轮（56×56）"
        - "顶部中央层签「第三场 · 雪夜破庙」，26px 以上，宣纸窄条"
        - "层签下方：敌方 1–3 个单位的血条与意图图标（同一水平线，图标 48px）"
        - "敌方血条右上：战利品预览小卡（不遮血条）"
      center:
        - "画面 30%–35%：敌方（雪鸦寨刀手 ×2 + 弓手），立于断碑与破庙门槛之后"
        - "画面 35%–70%：空战场，仅雪地与墨色刀光层，禁止 UI"
        - "画面 66%–78%：老黄背影，宽斗篷，雁翎刀垂于右侧，血条在其头顶上方 12px"
      bottom:
        - "手牌区：5 张扇形排列的刀诀卡，卡宽 196px，重叠 24px"
        - "左下：气 3/3 金箔圆点；右下：结束回合朱砂描边按钮（84px 高）"
        - "底部 96px 安全区内只保留手势条留白"
      floating:
        - "飘字层（伤害/气不足），位于 40%–66% 高度"
        - "暂停确认层（半透明墨罩 + 宣纸面板）"
        - "战后三选一刀诀层"
    components:
      - "btn-primary"
      - "panel-card"
      - "bar-hp"
      - "ap-pips"
      - "card-skill"
      - "enemy-intent"
      - "icon-settings"
      - "icon-pause"
    states:
      - player-turn
      - enemy-turn
      - victory
      - defeat
      - paused
      - low-ap
    edge_cases:
      - "单敌：目标自动锁定，不显示点选高亮"
      - "三敌：意图图标允许两行，血条压缩到 8px 高"
      - "手牌为空：显示「无招可用」，结束回合仍可点"
      - "气为 0：非 0 费手牌置灰，点击抖动并飘字「气不足」"
    data_needs:
      - "battle.turn"
      - "battle.stage"
      - "battle.playerHp / playerHpMax"
      - "battle.ap / apMax"
      - "battle.hand[].cost"
      - "battle.enemies[].hp / intent / intentValue"
      - "battle.lootPreview"
    output:
      brief: "prompts/pages/battle.md"
      prompt: "prompts/pages/battle.md"
      image: "assets/pages/battle-v2.png"

  - id: settings
    name: 设置
    category: support
    priority: must-have
    status: approved
    purpose: "在不迷路的前提下调完就走：任何改动一次点击完成，返回永远只有一步。"
    entry_points:
      - "home 右上齿轮"
      - "home 底部导航「设置」"
      - "battle 右上齿轮（覆盖层）"
    primary_actions:
      - "返回（自动保存）"
      - "切换开关 / 拖动滑块"
      - "恢复默认（二次确认）"
    dependencies:
      - "profile.settings"
      - "profile.account"
    layout:
      top:
        - "左上返回毛笔箭头（56×56）+ 居中标题「设置」（竖排或横排粗宋）"
        - "标题下 2px 朱砂细线，长度 120px，居中"
      center:
        - "四组宣纸卡片纵向排列，间距 24px，卡片内边距 28px"
        - "音画：音乐滑块 / 音效滑块 / 画质分段（高·中·低）"
        - "操作：震动开关 / 一键出招开关 / 字号分段（标准·大）"
        - "账号：江湖名（未入江湖）/ 绑定 / 客服"
        - "其他：语言 / 隐私 / 关于"
      bottom:
        - "版本号 v0.1.0（22px，居中，低对比）"
        - "「恢复默认」文字按钮，位于版本号上方，无改动时置灰"
      floating:
        - "确认层（恢复默认）"
        - "保存失败窄条"
    components:
      - "panel-card"
      - "icon-back"
      - "row-setting"
      - "slider"
      - "segmented"
      - "toggle-switch"
    states:
      - default
      - dirty
      - confirm-reset
      - error
    edge_cases:
      - "改动未落盘：返回处显示朱砂小点，返回时自动重试一次"
      - "无马达设备：震动项置灰并标注「此机无感」"
      - "未登录：账号组显示「未入江湖」，绑定为主按钮样式"
      - "字号切「大」：行高与卡片同步增高，不裁切标签"
    data_needs:
      - "settings.musicVolume"
      - "settings.sfxVolume"
      - "settings.quality"
      - "settings.haptics"
      - "settings.fontScale"
      - "settings.language"
      - "profile.accountName"
    output:
      brief: "prompts/pages/settings.md"
      prompt: "prompts/pages/settings.md"
      image: "assets/pages/settings-v1.png"

  - id: map
    name: 上山路线图
    category: core
    priority: must-have
    status: approved
    purpose: "在一屏内看清「打到第几个、下一步打谁、能拿什么」，并决定继续上山还是撤回客栈。"
    entry_points:
      - "home「接着打」后进入"
      - "victory「接着往山上走」"
      - "battle 撤退确认后回到此处"
    primary_actions:
      - "点节点查看该位情敌"
      - "拔刀（进入 battle / rival-intro）"
      - "回客栈"
    dependencies:
      - "run.routeNodes（节点 id / 状态 / 情敌 id）"
      - "run.rivalProgress"
      - "wallet.silver / wallet.wine"
    layout:
      top:
        - "左上返回（56×56）+ 标题「上山」54px + 副标「九场 · 已过三场」"
        - "右上「回客栈」次按钮（196×56）"
        - "顶部 220px 纸雾，保证标题压在山峦上也清晰"
      center:
        - "水磨长卷底图：一条雪中山道自上而下，四处灯火地标"
        - "四个路线节点沿山道分布，自下而上：四 / 五 / 六 / 庄"
        - "节点 84px 圆牌（头目 104px），下方 46px 名条；已过降饱和、当前朱砂实底、未到墨描边"
      bottom:
        - "当前目标卡（32px 边距，356px 高）：关名 + 情敌名 + 一句台词 + 奖励预览 + 拔刀主按钮"
        - "底部 96px 安全区留白"
      floating:
        - "节点选中态：朱砂外环 8px + 名条反色"
        - "路线未解锁时节点置灰并显示「再走一场」提示"
    components:
      - "route-node"
      - "btn-primary"
      - "btn-secondary"
      - "panel-card"
      - "icon-back"
    states:
      - default
      - node-selected
      - all-cleared
      - offline
    edge_cases:
      - "九场全通：头目节点换「已破」印章，主按钮切「下山」"
      - "节点重叠：360dp 窄屏下名条改为只显示编号，全名进详情卡"
      - "断网：路线照常可走，仅奖励结算延后"
    data_needs:
      - "route.nodes[].id / state / rivalId"
      - "rival.id / name / title / taunt / tag"
      - "rival.rewardPreview"
      - "run.clearedCount"
    output:
      brief: "prompts/pages/map.md"
      prompt: "prompts/pages/map.md"
      image: "assets/pages/map-v1.png"

  - id: rival-intro
    name: 情敌登场（对峙）
    category: core
    priority: must-have
    status: approved
    purpose: "在两三句台词里交代「这人是谁、为什么挡路、他的脾气」，并给出「拔刀 / 听完」两条路。"
    entry_points:
      - "map 节点「拔刀」（关底情敌）"
      - "battle 连胜后自动触发"
    primary_actions:
      - "拔刀（进入 boss-battle）"
      - "听他念完（继续下一句）"
      - "跳过"
    dependencies:
      - "rival.id / name / title / lines[]"
      - "run.rivalProgress"
    layout:
      top:
        - "左上返回、中央层签「关底 · 断桥雪渡 ｜ 情敌 5/9」、右上「跳过 ›」文字"
        - "右缘竖排「情敌 · 之五」，压在暗色屋檐上"
      center:
        - "左侧 20%：老黄皮衣背影，几乎全黑剪影"
        - "右侧 34%：情敌正面，红灯笼顶光，折扇半开"
        - "中部 45%：空雪地，禁止任何 UI"
      bottom:
        - "台词卡（54px 边距，296px 高）：朱砂编号印 + 姓名 + 性格标签 + 台词 + 老黄回一句"
        - "主按钮「拔刀」600×84，次按钮「听他念完」348×56"
        - "底部提示「轻点继续 · 右上可跳过」"
      floating:
        - "台词逐字机（每字 28ms），点任意处加速"
    components:
      - "btn-primary"
      - "btn-secondary"
      - "panel-card"
      - "icon-back"
    states:
      - line-1
      - line-2
      - line-3
      - skipped
    edge_cases:
      - "已看过：默认折叠为一行摘要，点「听他念完」才展开"
      - "极长台词：超过 46 字自动分页，不缩字号"
      - "无声设备：台词仍逐字推进但不震动"
    data_needs:
      - "rival.name / title / tag"
      - "rival.lines[]"
      - "player.replyLine"
      - "rival.index / total"
    output:
      brief: "prompts/pages/rival-intro.md"
      prompt: "prompts/pages/rival-intro.md"
      image: "assets/pages/rival-v1.png"

  - id: boss-battle
    name: 关底情敌战
    category: core
    priority: must-have
    status: approved
    status_note: "与 battle 共用战斗系统，仅 HUD 换装"
    purpose: "把「打情敌」和「打杂兵」在视觉上一刀切开：一条长血条、一个名字、一句嘲讽。"
    entry_points:
      - "rival-intro「拔刀」"
      - "battle 第三回合后情敌入场"
    primary_actions:
      - "点手牌出招"
      - "结束回合"
      - "暂停"
    dependencies:
      - "battle.enemies[0]（唯一目标）"
      - "battle.bossPhase"
      - "player.shield"
    layout:
      top:
        - "左上暂停（56×56）+ 头目名条（116→1040，88px 高）：朱砂编号印 + 名 + 身份 + 「关底 · 情敌之九」"
        - "名条下 18px：1000×22 四段刻度长血条"
        - "血条下：血量 / 甲 / 阶段 / 意图（蓄力 28）"
      center:
        - "画面 16%–50%：情敌全身立绘，牌楼与铁灯列队，朱砂腰带为唯一饱和色"
        - "画面 50%–78%：墨色空场，只放嘲讽台词，禁止 UI"
      bottom:
        - "手牌 5 张，牌面 200×238"
        - "左下：老黄血条 + 皮衣护盾（破甲后显示「皮衣已破 0」）"
        - "中下：气牌 56px 高宣纸小牌；右下：结束回合 340×84"
      floating:
        - "阶段转换：全屏墨闪 1 帧 + 名条朱砂闪烁"
        - "破甲：护盾条碎裂飞白，飘字「甲破」"
    components:
      - "bar-boss"
      - "bar-hp"
      - "card-skill-lg"
      - "btn-primary"
      - "panel-card"
    states:
      - phase-1
      - phase-2
      - enraged
      - victory
      - defeat
    edge_cases:
      - "情敌只剩一滴血：血条进入「残」态，填充改金箔色"
      - "玩家护盾为 0：护盾行改朱砂并显示「皮衣已破」"
      - "气不足：非 0 费手牌置灰，点击抖动"
    data_needs:
      - "boss.name / title / hp / hpMax / armor / phase"
      - "boss.intent / intentValue"
      - "boss.tauntLine"
      - "player.hp / shield / ap"
    output:
      brief: "prompts/pages/boss-battle.md"
      prompt: "prompts/pages/boss-battle.md"
      image: "assets/pages/boss-v1.png"

  - id: victory
    name: 战后三选一
    category: core
    priority: must-have
    status: approved
    purpose: "让胜利的爽感落在「拿走他一样东西」上：三张牌面一眼可辨，选完就走。"
    entry_points:
      - "boss-battle 击败情敌"
      - "battle 清场（普通战版本去掉大印，其余一致）"
    primary_actions:
      - "选一张刀诀（点卡面）"
      - "取此诀"
      - "换一壶酒（跳过）"
    dependencies:
      - "reward.picks[3]"
      - "deck.cards[]"
      - "wallet.wine / wallet.silver"
    layout:
      top:
        - "顶部 78px：层签「战后 · 断桥雪渡」"
        - "朱砂大印「胜」128×128 + 「第五位情敌，躺下了」46px + 情敌名与一句评语"
        - "右端战利品：银两 +18 / 声望 +6"
      center:
        - "分隔线后「三选一 · 拿走他身上的一样东西」"
        - "三张 300×400 刀诀大卡横排，间距 34px；选中卡朱砂外环 + 「已选」下挂标"
        - "卡面：左上费用圆、右上稀有度、中段墨绘图标、牌名 40px、底部效果"
      bottom:
        - "提示行「跳过不要，换 1 壶酒（当前 3 壶）」"
        - "本局已得：4 张 92×122 缩略牌 + 进度文案"
        - "主按钮「取此诀」+ 次按钮「换一壶酒」"
        - "老黄一句收尾台词 + 「下一位」预告条"
      floating:
        - "选定：卡面抬升 8px，其余两张降饱和 35%"
        - "跳过：飘字「+1 壶酒」"
    components:
      - "card-skill-lg"
      - "btn-primary"
      - "btn-secondary"
      - "panel-card"
    states:
      - picking
      - selected
      - skipped
    edge_cases:
      - "三张同稀有度：靠图标轮廓区分，不靠颜色"
      - "牌组已满 24 张：主按钮改「替换一张」，进入对比视图"
      - "酒已满 5 壶：跳过项置灰并注明「壶满了」"
    data_needs:
      - "reward.picks[].id / name / cost / effect / rarity"
      - "reward.silver / reward.fame"
      - "deck.cards[]"
      - "wallet.wine"
    output:
      brief: "prompts/pages/victory.md"
      prompt: "prompts/pages/victory.md"
      image: "assets/pages/victory-v1.png"
