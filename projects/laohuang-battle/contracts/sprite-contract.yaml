schema_version: 1
project_id: "laohuang-battle"
# 本迭代组件为「一文件一资产」直接产出，未经精灵表切片，
# 因此 source.sheet_path 留空、status 保持 draft；items 仍按语义命名登记，
# 供 kui atlas 打包图集使用。
status: draft
pack_id: ui-components
text_policy: remove-all
source:
  screen_id: home
  sheet_asset_id: null
  sheet_path: ""
detection:
  mode: auto
  alpha_threshold: 8
  background_tolerance: 24
  connect_gap: 2
  min_area: 64
  padding: 4
output:
  items_dir: assets/components
  manifest_path: contracts/asset-manifest.yaml
  package_path: ""
semantic_mapping:
  required: true
  naming_pattern: "{category}-{variant}-{state}"
items:
  - id: btn-primary-default
    semantic_name: control-primary-default
    component_id: btn-primary
    category: control
    state: default
    path: assets/components/btn-primary-default-v1.png
    dimensions: [600, 84]
    bbox: [0, 0, 600, 84]
    slice: {type: 9-slice, margins: [24, 24, 24, 24]}

  - id: btn-primary-pressed
    semantic_name: control-primary-pressed
    component_id: btn-primary
    category: control
    state: pressed
    path: assets/components/btn-primary-pressed-v1.png
    dimensions: [600, 84]
    bbox: [0, 0, 600, 84]
    slice: {type: 9-slice, margins: [24, 24, 24, 24]}

  - id: btn-secondary-default
    semantic_name: control-secondary-default
    component_id: btn-secondary
    category: control
    state: default
    path: assets/components/btn-secondary-default-v1.png
    dimensions: [288, 56]
    bbox: [0, 0, 288, 56]
    slice: {type: 9-slice, margins: [18, 18, 18, 18]}

  - id: btn-secondary-pressed
