<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<link rel="stylesheet" href="../ui.css"><link rel="stylesheet" href="comp.css">
<style>
  .bt { position: relative; height: 22px; border-radius: 2px; background: #241f1b;
    box-shadow: inset 0 0 0 2px rgba(10,8,6,0.85), 0 0 0 1px rgba(245,238,219,0.28); overflow: hidden; }
  .bt > i { position: absolute; inset: 0 auto 0 0; width: 56%;
    background: linear-gradient(to bottom, #c2452f, #99301f);
    box-shadow: inset 0 2px 0 rgba(245,238,219,0.24); }
  .bt .ticks { position: absolute; inset: 0; display: flex; }
  .bt .ticks span { flex: 1; border-right: 2px solid rgba(10,8,6,0.55); }
  .bt .ticks span:last-child { border-right: none; }
</style></head>
<body class="sprite">
<div class="stage" style="width:1000px;height:22px">
  <div class="bt"><i></i><div class="ticks"><span></span><span></span><span></span><span></span></div></div>
</div>
</body></html>
