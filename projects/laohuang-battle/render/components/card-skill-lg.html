<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<link rel="stylesheet" href="../ui.css"><link rel="stylesheet" href="comp.css">
<style>
  .pick {
    position: relative; width: 300px; height: 400px;
    border-radius: var(--r-card);
    --surface: var(--paper-raised); --edge: var(--ink);
  }
  .pick::after {
    content: ""; position: absolute; inset: 12px; border-radius: 4px;
    box-shadow: inset 0 0 0 1px rgba(25, 21, 18, 0.16);
  }
</style></head>
<body class="sprite">
<svg width="0" height="0" style="position:absolute"><defs>
<filter id="rough" x="-8%" y="-8%" width="116%" height="116%">
<feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="3" seed="11" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="2.0" xChannelSelector="R" yChannelSelector="G"/>
</filter></defs></svg>
<div class="stage" style="width:300px;height:400px"><div class="pick mounted pressable"></div></div>
<script>if(location.search.indexOf("pressed")>=0)document.body.classList.add("pressed");</script>
</body></html>
