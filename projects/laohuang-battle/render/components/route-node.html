<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<link rel="stylesheet" href="../ui.css"><link rel="stylesheet" href="comp.css">
<style>
  .stage { display: flex; align-items: center; justify-content: center; }
  .nd {
    position: relative; width: 84px; height: 84px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .nd::before {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: rgba(242, 234, 218, 0.94);
    box-shadow: 0 0 0 3px var(--ink), 0 0 0 8px rgba(242, 234, 218, 0.72), 0 8px 18px rgba(44, 58, 56, 0.26);
    filter: url(#rough);
  }
</style></head>
<body class="sprite">
<svg width="0" height="0" style="position:absolute"><defs>
<filter id="rough" x="-14%" y="-14%" width="128%" height="128%">
<feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="3" seed="11" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="2.0" xChannelSelector="R" yChannelSelector="G"/>
</filter></defs></svg>
<div class="stage" style="width:110px;height:110px"><div class="nd pressable"></div></div>
<script>if(location.search.indexOf("pressed")>=0)document.body.classList.add("pressed");</script>
</body></html>
