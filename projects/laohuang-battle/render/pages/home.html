<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../ui.css" />
<style>
  .artwrap {
    position: absolute;
    left: -140px;
    top: 214px;
    width: 780px;
    height: 1116px;
    overflow: hidden;
    z-index: 2;
    -webkit-mask-image:
      linear-gradient(to bottom, #000 0 86%, rgba(0, 0, 0, 0.4) 96%, transparent 100%),
      linear-gradient(to right, #000 0 76%, rgba(0, 0, 0, 0.5) 90%, transparent 100%);
    -webkit-mask-composite: source-in;
    mask-image:
      linear-gradient(to bottom, #000 0 86%, rgba(0, 0, 0, 0.4) 96%, transparent 100%),
      linear-gradient(to right, #000 0 76%, rgba(0, 0, 0, 0.5) 90%, transparent 100%);
    mask-composite: intersect;
  }
  .artwrap img {
    position: absolute;
    left: 0;
    top: -6px;
    width: 780px;
    filter: brightness(1.09) saturate(0.94) contrast(1.05);
  }
  .logo .b { font-size: 90px; }
  .logo .d { font-size: 52px; color: #4a4137; }
  .logo .s { font-size: 74px; }
  .sealwrap { position: absolute; right: 44px; top: 706px; }
  .colophon {
    position: absolute;
    right: 58px;
    top: 846px;
    height: 338px;
    display: flex;
    flex-direction: row-reverse;
    align-items: flex-start;
    gap: 18px;
    padding-left: 24px;
    border-left: 1.5px solid rgba(178, 58, 40, 0.42);
  }
  .colophon span {
    writing-mode: vertical-rl;
    height: 100%;
    font-size: 21px;
    line-height: 1;
    letter-spacing: 0.26em;
    color: rgba(74, 65, 55, 0.72);
  }
  .colophon span.c2 {
    font-size: 18px;
    letter-spacing: 0.32em;
    color: rgba(74, 65, 55, 0.44);
  }
</style>
</head>
<body>
<div class="page">
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <filter id="rough" x="-8%" y="-8%" width="116%" height="116%">
        <feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="3" seed="11" result="n" />
        <feDisplacementMap in="SourceGraphic" in2="n" scale="2.0" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </defs>
  </svg>

  <div class="vignette"></div>
  <div class="artwrap"><img src="../art/home2-art.png" alt="" /></div>
  <div class="fiber"></div>

  <!-- 资源条 -->
  <div class="resbar">
    <div class="res">
      <svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="11.5" /><rect x="11.5" y="11.5" width="9" height="9" rx="1" /></svg>
      <span>1286</span><span class="unit">两</span>
    </div>
    <div class="res">
      <svg viewBox="0 0 32 32"><path d="M12 5h8v4l3.5 5.5V26H8.5V14.5L12 9z" /><path d="M12 9h8" /><path d="M10 19h12" /></svg>
      <span>3</span><span class="unit">壶</span>
    </div>
    <div class="res">
      <svg viewBox="0 0 32 32"><rect x="6" y="6" width="20" height="20" rx="1.5" /><path d="M16 6v20" /><path d="M6 16h20" /></svg>
      <span>47</span><span class="unit">声望</span>
    </div>
    <div style="margin-left:auto" class="icon-btn mounted">
      <svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="5.2" /><circle cx="16" cy="16" r="11" stroke-dasharray="3 3.2" /><path d="M16 2.6v3M16 26.4v3M2.6 16h3M26.4 16h3" /></svg>
    </div>
  </div>

  <div class="microcopy">上次 · 昨夜 亥时 · 打到半山腰</div>

  <!-- 竖排 LOGO + 朱砂印 -->
  <div class="logo"><span class="b">老黄</span><span class="d">的</span><span class="s">战斗</span></div>
  <div class="sealwrap"><div class="seal lg"><span>黄</span></div></div>
  <div class="colophon"><span>刀不快　人已旧　皮衣还在</span><span class="c2">九场桃花债</span></div>

  <!-- 进度木牌 -->
  <div class="plaque mounted" style="left:40px; top:1338px; width:640px;">
    <div class="seal sm"><span>五</span></div>
    <div class="where">断桥雪渡</div>
    <div class="sep"></div>
    <div class="meta">九场之五 · 余 4</div>
  </div>

  <!-- 流派标签 -->
  <div class="tags" style="left:40px; top:1440px;">
    <div class="tag on">回锋</div>
    <div class="tag">算力</div>
    <div class="tag">皮衣</div>
  </div>

  <div class="btn primary" style="position:absolute; left:40px; top:1520px; width:600px;"><span>接着打</span></div>

  <div style="position:absolute; left:40px; top:1632px; display:flex; gap:24px;">
    <div class="btn secondary mounted" style="width:288px;"><span>开新局</span></div>
    <div class="btn secondary mounted" style="width:288px;"><span>情敌名录</span></div>
  </div>

  <!-- 底部导航 -->
  <div class="nav">
    <div class="nav-item on">
      <svg viewBox="0 0 32 32"><path d="M4 14.5 16 5l12 9.5" /><path d="M7.5 14v12.5h17V14" /><path d="M13 26.5v-7h6v7" /></svg>
      <span>客栈</span>
    </div>
    <div class="nav-item">
      <svg viewBox="0 0 32 32"><path d="M6 6.5h8a4 4 0 0 1 4 4v16a4 4 0 0 0-3.2-1.6H6z" /><path d="M26 6.5h-8a4 4 0 0 0-4 4v16a4 4 0 0 1 3.2-1.6H26z" /></svg>
      <span>名录</span>
    </div>
    <div class="nav-item">
      <svg viewBox="0 0 32 32"><path d="M12 5h8v3.6l3 4.4V27H9V13l3-4.4z" /><path d="M11 18h10" /></svg>
      <span>酒壶</span>
    </div>
    <div class="nav-item">
      <svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="5.2" /><circle cx="16" cy="16" r="11" stroke-dasharray="3 3.2" /></svg>
      <span>设置</span>
    </div>
  </div>

  <div class="grain"></div>
</div>
</body>
</html>
